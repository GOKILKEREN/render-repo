name: render
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion render src/index.ts TenSecondGills out/video.mp4 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: video-hasil
          path: out/video.mp4
